  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

  }

  ) {

  }

  }

    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

  }

    min-width: 44px;
    min-height: 44px;

  }

    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

    margin-top: 12px;
  }
}

        &lt;g id=&quot;cdi-needle-group&quot;&gt;
          &lt;line id=&quot;shared-cdi-needle&quot; class=&quot;cdi-needle&quot; x1=&quot;240&quot; y1=&quot;151&quot; x2=&quot;240&quot; y2=&quot;299&quot;/&gt;
          &lt;polygon id=&quot;shared-cdi-head&quot; class=&quot;cdi-arrow&quot; points=&quot;240,137 230,158 250,158&quot;/&gt;
          &lt;polygon id=&quot;shared-cdi-tail&quot; class=&quot;cdi-arrow&quot; points=&quot;240,313 230,292 250,292&quot;/&gt;
        &lt;/g&gt;

        &lt;circle class=&quot;centre-ring&quot; cx=&quot;240&quot; cy=&quot;225&quot; r=&quot;17&quot;/&gt;

        &lt;circle class=&quot;obs-knob&quot; cx=&quot;82&quot; cy=&quot;473&quot; r=&quot;31&quot;/&gt;
        &lt;text class=&quot;svg-label&quot; x=&quot;82&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot;&gt;OBS&lt;/text&gt;
        &lt;text id=&quot;instrument-readout&quot; class=&quot;svg-label&quot; x=&quot;286&quot; y=&quot;465&quot; text-anchor=&quot;middle&quot;&gt;CDI CENTERED&lt;/text&gt;
        &lt;text id=&quot;instrument-scale&quot; class=&quot;svg-small&quot; x=&quot;286&quot; y=&quot;494&quot; text-anchor=&quot;middle&quot;&gt;VOR: 2° per dot · 10° full scale&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;vor-controls&quot; class=&quot;controls&quot;&gt;
    &lt;label class=&quot;control-label form-label&quot; for=&quot;combined-obs-control&quot;&gt;
      &lt;span class=&quot;control-head&quot;&gt;&lt;span&gt;OBS selected course&lt;/span&gt;&lt;span id=&quot;combined-obs-value&quot; class=&quot;tabular-nums&quot;&gt;000°&lt;/span&gt;&lt;/span&gt;
      &lt;input id=&quot;combined-obs-control&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;359&quot; step=&quot;1&quot; value=&quot;0&quot;/&gt;
    &lt;/label&gt;

    &lt;label class=&quot;control-label form-label&quot; for=&quot;combined-radial-control&quot;&gt;
      &lt;span class=&quot;control-head&quot;&gt;&lt;span&gt;Aircraft radial&lt;/span&gt;&lt;span id=&quot;combined-radial-value&quot; class=&quot;tabular-nums&quot;&gt;000°&lt;/span&gt;&lt;/span&gt;
      &lt;input id=&quot;combined-radial-control&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;359&quot; step=&quot;1&quot; value=&quot;0&quot;/&gt;
    &lt;/label&gt;

    &lt;label class=&quot;form-check wide-control&quot; for=&quot;vor-signal-valid&quot;&gt;
      &lt;input id=&quot;vor-signal-valid&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; checked/&gt;
      &lt;span&gt;VOR signal reliable&lt;/span&gt;
    &lt;/label&gt;

    &lt;div class=&quot;preset-row&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-vor-obs=&quot;0&quot; data-vor-radial=&quot;0&quot;&gt;North / centered FROM&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-vor-obs=&quot;350&quot; data-vor-radial=&quot;80&quot;&gt;350° / 080° OFF example&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-vor-obs=&quot;350&quot; data-vor-radial=&quot;170&quot;&gt;350° centered TO&lt;/button&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hint&quot;&gt;The course index stays fixed. Turning OBS rotates the card, so N is at the top only when 000° is selected.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;gps-controls&quot; class=&quot;controls hidden&quot;&gt;
    &lt;label class=&quot;control-label form-label&quot; for=&quot;gps-course-control&quot;&gt;
      &lt;span class=&quot;control-head&quot;&gt;&lt;span&gt;Selected GPS course&lt;/span&gt;&lt;span id=&quot;gps-course-value&quot; class=&quot;tabular-nums&quot;&gt;000°&lt;/span&gt;&lt;/span&gt;
      &lt;input id=&quot;gps-course-control&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;359&quot; step=&quot;1&quot; value=&quot;0&quot;/&gt;
    &lt;/label&gt;

    &lt;label class=&quot;control-label form-label&quot; for=&quot;gps-phase-control&quot;&gt;
      &lt;span class=&quot;control-head&quot;&gt;&lt;span&gt;CDI scale&lt;/span&gt;&lt;span id=&quot;gps-scale-value&quot; class=&quot;tabular-nums&quot;&gt;±5 NM&lt;/span&gt;&lt;/span&gt;
      &lt;select id=&quot;gps-phase-control&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;exam-enr&quot;&gt;PPL exam ENR — ±5 NM&lt;/option&gt;
        &lt;option value=&quot;modern-enr&quot;&gt;Modern ENR — ±2 NM&lt;/option&gt;
        &lt;option value=&quot;terminal&quot;&gt;TERM — ±1 NM&lt;/option&gt;
        &lt;option value=&quot;approach&quot;&gt;APR — ±0.3 NM&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;

    &lt;label class=&quot;control-label form-label wide-control&quot; for=&quot;gps-error-control&quot;&gt;
      &lt;span class=&quot;control-head&quot;&gt;&lt;span&gt;Cross-track error&lt;/span&gt;&lt;span id=&quot;gps-error-value&quot; class=&quot;tabular-nums&quot;&gt;5 NM right&lt;/span&gt;&lt;/span&gt;
      &lt;input id=&quot;gps-error-control&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;1&quot; value=&quot;5&quot;/&gt;
    &lt;/label&gt;

    &lt;label class=&quot;form-check wide-control&quot; for=&quot;gps-signal-valid&quot;&gt;
      &lt;input id=&quot;gps-signal-valid&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; checked/&gt;
      &lt;span&gt;GPS guidance reliable&lt;/span&gt;
    &lt;/label&gt;

    &lt;div class=&quot;preset-row&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-gps-fraction=&quot;0&quot;&gt;Centered&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-gps-fraction=&quot;0.2&quot;&gt;One dot right&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-gps-fraction=&quot;1&quot;&gt;Full-scale right&lt;/button&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hint&quot;&gt;GPS uses distance, not VOR degrees. The source and active CDI scale must always be checked.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;combined-cdi-simulator&#x27;);
  if (!root) return;

  const state = root.querySelector(&#x27;#combined-state&#x27;);
  const sourceButtons = [...root.querySelectorAll(&#x27;[data-source]&#x27;)];
  const vorControls = root.querySelector(&#x27;#vor-controls&#x27;);
  const gpsControls = root.querySelector(&#x27;#gps-controls&#x27;);
  const vorMap = root.querySelector(&#x27;#vor-map&#x27;);
  const gpsMap = root.querySelector(&#x27;#gps-map&#x27;);
  const mapHeading = root.querySelector(&#x27;#map-heading&#x27;);

  const obsControl = root.querySelector(&#x27;#combined-obs-control&#x27;);
  const radialControl = root.querySelector(&#x27;#combined-radial-control&#x27;);
  const obsValue = root.querySelector(&#x27;#combined-obs-value&#x27;);
  const radialValue = root.querySelector(&#x27;#combined-radial-value&#x27;);
  const vorSignal = root.querySelector(&#x27;#vor-signal-valid&#x27;);
  const selectedCourse = root.querySelector(&#x27;#vor-selected-course&#x27;);
  const courseArrow = root.querySelector(&#x27;#vor-course-arrow&#x27;);
  const aircraftRadial = root.querySelector(&#x27;#vor-aircraft-radial&#x27;);
  const vorAircraft = root.querySelector(&#x27;#vor-aircraft&#x27;);

  const gpsCourseControl = root.querySelector(&#x27;#gps-course-control&#x27;);
  const gpsCourseValue = root.querySelector(&#x27;#gps-course-value&#x27;);
  const gpsPhaseControl = root.querySelector(&#x27;#gps-phase-control&#x27;);
  const gpsScaleValue = root.querySelector(&#x27;#gps-scale-value&#x27;);
  const gpsErrorControl = root.querySelector(&#x27;#gps-error-control&#x27;);
  const gpsErrorValue = root.querySelector(&#x27;#gps-error-value&#x27;);
  const gpsSignal = root.querySelector(&#x27;#gps-signal-valid&#x27;);
  const gpsCrossTrack = root.querySelector(&#x27;#gps-cross-track-line&#x27;);
  const gpsDistanceLabel = root.querySelector(&#x27;#gps-distance-label&#x27;);
  const gpsAircraft = root.querySelector(&#x27;#gps-aircraft&#x27;);
  const gpsSideLabel = root.querySelector(&#x27;#gps-side-label&#x27;);

  const ticksGroup = root.querySelector(&#x27;#course-card-ticks&#x27;);
  const labelsGroup = root.querySelector(&#x27;#course-card-labels&#x27;);
  const sourceLabel = root.querySelector(&#x27;#source-label&#x27;);
  const senseGroup = root.querySelector(&#x27;#sense-group&#x27;);
  const senseArrow = root.querySelector(&#x27;#sense-arrow&#x27;);
  const senseLabel = root.querySelector(&#x27;#sense-label&#x27;);
  const navFlag = root.querySelector(&#x27;#nav-flag&#x27;);
  const needleGroup = root.querySelector(&#x27;#cdi-needle-group&#x27;);
  const cdiNeedle = root.querySelector(&#x27;#shared-cdi-needle&#x27;);
  const cdiHead = root.querySelector(&#x27;#shared-cdi-head&#x27;);
  const cdiTail = root.querySelector(&#x27;#shared-cdi-tail&#x27;);
  const instrumentReadout = root.querySelector(&#x27;#instrument-readout&#x27;);
  const instrumentScale = root.querySelector(&#x27;#instrument-scale&#x27;);

  const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const cardCx = 240;
  const cardCy = 225;
  const tickElements = [];
  const labelElements = [];
  let source = &#x27;vor&#x27;;

  const gpsScales = {
    &#x27;exam-enr&#x27;: {scale: 5, label: &#x27;GPS ENR&#x27;, decimals: 1},
    &#x27;modern-enr&#x27;: {scale: 2, label: &#x27;GPS ENR&#x27;, decimals: 1},
    terminal: {scale: 1, label: &#x27;GPS TERM&#x27;, decimals: 1},
    approach: {scale: 0.3, label: &#x27;GPS APR&#x27;, decimals: 2}
  };

  function normalize(value) {
    return ((Math.round(value) % 360) + 360) % 360;
  }

  function bearing(value) {
    return String(normalize(value)).padStart(3, &#x27;0&#x27;) + &#x27;°&#x27;;
  }

  function signedDifference(a, b) {
    return ((a - b + 540) % 360) - 180;
  }

  function point(bearingValue, radius, cx = 240, cy = 220) {
    const radians = bearingValue * Math.PI / 180;
    return {x: cx + Math.sin(radians) * radius, y: cy - Math.cos(radians) * radius};
  }

  function setLine(line, start, end) {
    line.setAttribute(&#x27;x1&#x27;, start.x.toFixed(1));
    line.setAttribute(&#x27;y1&#x27;, start.y.toFixed(1));
    line.setAttribute(&#x27;x2&#x27;, end.x.toFixed(1));
    line.setAttribute(&#x27;y2&#x27;, end.y.toFixed(1));
  }

  for (let value = 0; value &lt; 360; value += 5) {
    const line = document.createElementNS(svgNS, &#x27;line&#x27;);
    line.setAttribute(&#x27;class&#x27;, value % 30 === 0 ? &#x27;card-tick-major&#x27; : &#x27;card-tick&#x27;);
    ticksGroup.appendChild(line);
    tickElements.push({value, line});
  }

  for (let value = 0; value &lt; 360; value += 30) {
    const text = document.createElementNS(svgNS, &#x27;text&#x27;);
    text.setAttribute(&#x27;class&#x27;, &#x27;card-label&#x27;);
    text.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
    text.setAttribute(&#x27;dominant-baseline&#x27;, &#x27;middle&#x27;);
    text.textContent = value === 0 ? &#x27;N&#x27; : value === 90 ? &#x27;E&#x27; : value === 180 ? &#x27;S&#x27; : value === 270 ? &#x27;W&#x27; : String(value / 10);
    labelsGroup.appendChild(text);
    labelElements.push({value, text});
  }

  function drawCourseCard(course) {
    tickElements.forEach(({value, line}) =&gt; {
      const angle = normalize(value - course);
      const outer = point(angle, 184, cardCx, cardCy);
      const inner = point(angle, value % 30 === 0 ? 165 : 173, cardCx, cardCy);
      setLine(line, outer, inner);
    });
    labelElements.forEach(({value, text}) =&gt; {
      const position = point(normalize(value - course), 147, cardCx, cardCy);
      text.setAttribute(&#x27;x&#x27;, position.x.toFixed(1));
      text.setAttribute(&#x27;y&#x27;, position.y.toFixed(1));
    });
  }

  function setNeedle(offset, usable = true) {
    const transform = `translate(${offset.toFixed(1)} 0)`;
    cdiNeedle.setAttribute(&#x27;transform&#x27;, transform);
    cdiHead.setAttribute(&#x27;transform&#x27;, transform);
    cdiTail.setAttribute(&#x27;transform&#x27;, transform);
    needleGroup.style.opacity = usable ? &#x27;1&#x27; : &#x27;.28&#x27;;
  }

  function setSense(flag) {
    if (flag === &#x27;OFF&#x27;) {
      senseGroup.classList.add(&#x27;hidden&#x27;);
      return;
    }
    senseGroup.classList.remove(&#x27;hidden&#x27;);
    senseLabel.textContent = flag;
    senseArrow.setAttribute(&#x27;points&#x27;, flag === &#x27;TO&#x27; ? &#x27;330,126 318,149 342,149&#x27; : &#x27;330,181 318,158 342,158&#x27;);
  }

  function setSignalValid(valid) {
    navFlag.classList.toggle(&#x27;hidden&#x27;, valid);
  }

  function updateVor() {
    const obs = Number(obsControl.value);
    const radial = Number(radialControl.value);
    const valid = vorSignal.checked;
    const difference = signedDifference(radial, obs);
    const radians = difference * Math.PI / 180;
    const courseError = Math.asin(Math.sin(radians)) * 180 / Math.PI;
    const ambiguous = Math.abs(Math.abs(difference) - 90) &lt;= 1;
    const flag = ambiguous ? &#x27;OFF&#x27; : (Math.cos(radians) &gt;= 0 ? &#x27;FROM&#x27; : &#x27;TO&#x27;);
    const needleDegrees = Math.max(-10, Math.min(10, -courseError));

    obsValue.textContent = bearing(obs);
    radialValue.textContent = bearing(radial);
    sourceLabel.textContent = &#x27;VOR&#x27;;
    instrumentScale.textContent = &#x27;VOR: 2° per dot · 10° full scale&#x27;;
    drawCourseCard(obs);
    setSense(valid ? flag : &#x27;OFF&#x27;);
    setSignalValid(valid);
    setNeedle(needleDegrees * 10, valid &amp;&amp; !ambiguous);

    const forward = point(obs, 150);
    const backward = point(normalize(obs + 180), 150);
    setLine(selectedCourse, backward, forward);
    const arrowTip = point(obs, 124);
    const arrowBase = point(obs, 103);
    const angle = obs * Math.PI / 180;
    const normalX = Math.cos(angle) * 10;
    const normalY = Math.sin(angle) * 10;
    courseArrow.setAttribute(&#x27;points&#x27;, `${arrowTip.x.toFixed(1)},${arrowTip.y.toFixed(1)} ${(arrowBase.x + normalX).toFixed(1)},${(arrowBase.y + normalY).toFixed(1)} ${(arrowBase.x - normalX).toFixed(1)},${(arrowBase.y - normalY).toFixed(1)}`);
    setLine(aircraftRadial, {x: 240, y: 220}, point(radial, 140));
    const aircraftPoint = point(radial, 169);
    vorAircraft.setAttribute(&#x27;transform&#x27;, `translate(${aircraftPoint.x.toFixed(1)} ${aircraftPoint.y.toFixed(1)})`);

    if (!valid) {
      state.textContent = &#x27;VOR signal unreliable → NAV flag displayed&#x27;;
      instrumentReadout.textContent = &#x27;DO NOT USE CDI&#x27;;
    } else if (ambiguous) {
      state.textContent = `${bearing(obs)} OBS and ${bearing(radial)} radial are 90° apart → TO/FROM ambiguous`;
      instrumentReadout.textContent = &#x27;TO/FROM AMBIGUOUS&#x27;;
    } else if (Math.abs(courseError) &lt; 0.5) {
      state.textContent = `${bearing(obs)} OBS · ${bearing(radial)} radial → CDI centered · ${flag}`;
      instrumentReadout.textContent = `CDI CENTERED · ${flag}`;
    } else {
      const side = needleDegrees &lt; 0 ? &#x27;LEFT&#x27; : &#x27;RIGHT&#x27;;
      const amount = Math.abs(courseError) &gt;= 10 ? &#x27;FULL&#x27; : `${Math.abs(courseError).toFixed(0)}°`;
      state.textContent = `${bearing(obs)} OBS · ${bearing(radial)} radial → CDI ${amount} ${side} · ${flag}`;
      instrumentReadout.textContent = `CDI ${amount} ${side} · ${flag}`;
    }
  }

  function currentGpsScale() {
    return gpsScales[gpsPhaseControl.value];
  }

  function updateGpsScale(resetError = false) {
    const config = currentGpsScale();
    gpsErrorControl.min = String(-config.scale);
    gpsErrorControl.max = String(config.scale);
    gpsErrorControl.step = String(config.scale / 5);
    if (resetError) gpsErrorControl.value = String(config.scale);
    gpsScaleValue.textContent = `±${config.scale} NM`;
  }

  function updateGps() {
    const course = Number(gpsCourseControl.value);
    const error = Number(gpsErrorControl.value);
    const valid = gpsSignal.checked;
    const config = currentGpsScale();
    const fraction = Math.max(-1, Math.min(1, error / config.scale));
    const dots = Math.abs(fraction) * 5;
    const side = error &lt; 0 ? &#x27;left&#x27; : error &gt; 0 ? &#x27;right&#x27; : &#x27;&#x27;;
    const needleSide = error &gt; 0 ? &#x27;LEFT&#x27; : error &lt; 0 ? &#x27;RIGHT&#x27; : &#x27;&#x27;;

    gpsCourseValue.textContent = bearing(course);
    gpsErrorValue.textContent = error === 0 ? &#x27;0 NM · on course&#x27; : `${Math.abs(error).toFixed(config.decimals)} NM ${side}`;
    sourceLabel.textContent = config.label;
    instrumentScale.textContent = `Full scale ±${config.scale} NM · each dot ${(config.scale / 5).toFixed(config.decimals)} NM`;
    drawCourseCard(course);
    setSense(valid ? &#x27;TO&#x27; : &#x27;OFF&#x27;);
    setSignalValid(valid);
    setNeedle(-fraction * 100, valid);

    const planeY = 220 + fraction * 90;
    gpsAircraft.setAttribute(&#x27;transform&#x27;, `translate(285 ${planeY.toFixed(1)}) rotate(90)`);
    gpsCrossTrack.setAttribute(&#x27;y2&#x27;, planeY.toFixed(1));
    gpsDistanceLabel.setAttribute(&#x27;y&#x27;, (220 + fraction * 45 + (fraction &lt; 0 ? -10 : 18)).toFixed(1));
    gpsDistanceLabel.textContent = error === 0 ? &#x27;ON COURSE&#x27; : `${Math.abs(error).toFixed(config.decimals)} NM`;
    gpsSideLabel.setAttribute(&#x27;y&#x27;, (planeY + (fraction &lt; 0 ? -38 : 48)).toFixed(1));
    gpsSideLabel.textContent = error === 0 ? &#x27;Aircraft on desired track&#x27; : `${Math.abs(error).toFixed(config.decimals)} NM ${side} of track`;

    if (!valid) {
      state.textContent = &#x27;GPS guidance unreliable → NAV flag displayed&#x27;;
      instrumentReadout.textContent = &#x27;DO NOT USE CDI&#x27;;
    } else if (error === 0) {
      state.textContent = `${bearing(course)} desired track · aircraft on course → CDI centered`;
      instrumentReadout.textContent = &#x27;CDI CENTERED · TO&#x27;;
    } else {
      const scaleText = Math.abs(fraction) &gt;= 1 ? &#x27;FULL&#x27; : `${dots.toFixed(1)} DOT${Math.abs(dots - 1) &lt; 0.01 ? &#x27;&#x27; : &#x27;S&#x27;}`;
      state.textContent = `${Math.abs(error).toFixed(config.decimals)} NM ${side} of track → CDI ${scaleText} ${needleSide}`;
      instrumentReadout.textContent = `CDI ${scaleText} ${needleSide}`;
    }
  }

  function showSource(nextSource) {
    source = nextSource;
    sourceButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.source === source)));
    vorControls.classList.toggle(&#x27;hidden&#x27;, source !== &#x27;vor&#x27;);
    gpsControls.classList.toggle(&#x27;hidden&#x27;, source !== &#x27;gps&#x27;);
    vorMap.classList.toggle(&#x27;hidden&#x27;, source !== &#x27;vor&#x27;);
    gpsMap.classList.toggle(&#x27;hidden&#x27;, source !== &#x27;gps&#x27;);
    mapHeading.textContent = source === &#x27;vor&#x27; ? &#x27;Aircraft position&#x27; : &#x27;GPS cross-track position&#x27;;
    if (source === &#x27;vor&#x27;) updateVor(); else updateGps();
  }

  sourceButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showSource(button.dataset.source)));
  obsControl.addEventListener(&#x27;input&#x27;, updateVor);
  radialControl.addEventListener(&#x27;input&#x27;, updateVor);
  vorSignal.addEventListener(&#x27;change&#x27;, updateVor);
  gpsCourseControl.addEventListener(&#x27;input&#x27;, updateGps);
  gpsErrorControl.addEventListener(&#x27;input&#x27;, updateGps);
  gpsSignal.addEventListener(&#x27;change&#x27;, updateGps);
  gpsPhaseControl.addEventListener(&#x27;change&#x27;, () =&gt; {
    updateGpsScale(true);
    updateGps();
  });

  root.querySelectorAll(&#x27;[data-vor-obs][data-vor-radial]&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      obsControl.value = button.dataset.vorObs;
      radialControl.value = button.dataset.vorRadial;
      vorSignal.checked = true;
      updateVor();
    });
  });

  root.querySelectorAll(&#x27;[data-gps-fraction]&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      gpsErrorControl.value = String(currentGpsScale().scale * Number(button.dataset.gpsFraction));
      gpsSignal.checked = true;
      updateGps();
    });
  });

  updateGpsScale(true);
  showSource(&#x27;vor&#x27;);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
